name: Python launcher tests

on:
  push:
    paths:
      - 'pythons_sort.py'
      - 'file_operations/pythons_sort.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'tests/**'
      - 'products/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'pythons_sort.py'
      - 'file_operations/pythons_sort.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'tests/**'
      - 'products/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests
      - name: Verify installed launcher outside checkout
        working-directory: '${{ runner.temp }}'
        run: pythons-sort --repository "$GITHUB_WORKSPACE" info --category scanners
